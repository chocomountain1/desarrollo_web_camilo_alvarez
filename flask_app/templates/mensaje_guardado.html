<!DOCTYPE html>
<html lang="es">
    <style>.contenedor_boton {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .boton_portada {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 12px 24px;

            transition: background-color 0.3s ease;

        }

        .boton_portada:hover {
            background-color: #0056b3;
        }</style>
    <div>
    <h1 style="justify-content: center; display: flex;">Hemos recibido su información, muchas gracias y suerte en su actividad</h1>
    </div>
    <div style="display: flex; justify-content: center; margin-top: 20%;">
        <a href="{{url_for('home')}}">
            <button class="contenedor_boton" type="button" style="padding: 10%;">Volver a la portada</button>
        </a>   
    </div>
</html>
