<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionador de actividades</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            color: #333;
            padding: 30px 20px;
        }

        h1, h2 {
            font-weight: 600;
            margin-bottom: 20px;
            color: #222;
        }

        h1 {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 50px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
            max-width: 400px;
        }

        .contenedor_boton {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .boton_portada {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .boton_portada:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            font-size: 0.95rem;
            color: #444;
        }

        th {
            background-color: #f0f0f0;
            font-weight: 600;
            color: #555;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        img {
            display: block;
            width: 320px;
            height: 240px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) {
            .contenedor_boton {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <h1>¡Bienvenido al gestionador de actividades de Chile!</h1>
    <div class="contenedor_boton">
        <a href="{{url_for('add_activity')}}">
            <button class="boton_portada">Agregar actividades</button>
        </a>
        <a href="{{url_for('activity_list')}}">
            <button class="boton_portada">Ver listado de actividades</button>
        </a>
        <a href="{{url_for('statistics')}}">
            <button class="boton_portada">Estadísticas</button>
        </a>
        <a th:href="@{/notes}">
            <button class="boton_portada">Evaluar Actividades</button>
        </a>
    </div>
    <h2>Últimas actividades agregadas</h2>
    <div>
        <table class="tabla_portada">
            <tr>
                <th>Inicio</th>
                <th>Término</th>
                <th>Comuna</th>
                <th>Sector</th>
                <th>Tema</th>
                <th>Foto</th>
                <th style="display: none;"></th>
            </tr>
            <tr th:each="actividad : ${actividades}">
                <td th:text="${#temporals.format(actividad.diaHoraInicio, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(actividad.diaHoraTermino, 'dd-MM-yyyy HH:mm')}"></td>
                <td></td>
                <td th:text="${actividad.sector}"></td>
                <td th:each="tema : ${actividad.temas}" th:if="${tema.glosaOtro == 'no_aplica'}" th:text="${#strings.toLowerCase(tema.tema)}"></td>
                <td th:each="tema : ${actividad.temas}" th:if="${tema.glosaOtro != 'no_aplica'}" th:text="${#strings.toLowerCase(tema.glosaOtro)}"></td>
                <td></td>
            </tr>
        </table>
    </div>
</body>
</html>
