<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actividades</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Tu CSS pegado aquí */
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            color: #333;
            padding: 30px 20px;
        }

        h1, h2 {
            font-weight: 600;
            margin-bottom: 20px;
            color: #222;
        }

        h1 {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 50px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
            max-width: 400px;
        }

        .contenedor_boton {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .boton_portada {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .boton_portada:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            font-size: 0.95rem;
            color: #444;
        }

        th {
            background-color: #f0f0f0;
            font-weight: 600;
            color: #555;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        img {
            display: block;
            width: 320px;
            height: 240px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) {
            .contenedor_boton {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <h1>Listado de Actividades</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Fecha Inicio</th>
                <th>Fecha Término</th>
                <th>Sector</th>
                <th>Nombre</th>
                <th>Tema</th>
                <th>Nota promedio</th>
                <th>Evaluar</th>
                <td style="display: none;"></td>
                <td style="display: none;"></td>
            </tr>
        </thead>
        <tbody>
           <tr th:each="actividad : ${actividades}" th:id="'fila-' + ${actividad.id}" th:attr="data-tr-id=${actividad.id}">
    <td th:text="${actividad.id}"></td>
    <td th:text="${#temporals.format(actividad.diaHoraInicio, 'dd-MM-yyyy HH:mm')}"></td>
    <td th:text="${#temporals.format(actividad.diaHoraTermino, 'dd-MM-yyyy HH:mm')}"></td>
    <td th:text="${actividad.sector}"></td>
    <td th:text="${actividad.getName()}"></td>
    <td th:each="tema : ${actividad.temas}" th:if="${tema.glosaOtro == 'no_aplica'}" th:text="${#strings.toLowerCase(tema.tema)}"></td>
    <td th:each="tema : ${actividad.temas}" th:if="${tema.glosaOtro != 'no_aplica'}" th:text="${#strings.toLowerCase(tema.glosaOtro)}"></td>
    <td th:id="prom- + ${actividad.id}"></td>
    
    <td th:id="'celda-boton-' + ${actividad.id}">
        <button type="button" class="boton_portada" th:attr="data-id=${actividad.id}" onclick="mostrarFormulario(this)">Evaluar</button>
    </td>

    <td th:id="'celda-form-' + ${actividad.id}" style="display: none;">
        <form th:attr="data-actividad-id=${actividad.id}" onsubmit="enviarNota(event)">
            <label for="nota">Nota:</label>
            <input type="number" name="nota" min="1" max="7" step="1" required>
            <button type="submit" class="boton_portada" style="padding-bottom: 1%;padding-top: 1%;">Enviar</button>
        </form>
    </td>
</tr>
        </tbody>
    </table>

</body>
<script th:src="@{/js/notas.js}"></script>
</html>
